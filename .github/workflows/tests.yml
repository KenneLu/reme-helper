name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    # Everything in this job prints Chinese (suite names, failure details, the
    # app's own messages). A hosted runner's stdout is a pipe, so Python would
    # otherwise encode it as the locale default (cp1252) and die on the first
    # non-ASCII print before reporting anything.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The suites check a real ReMe install, not a mock: put one where the app
      # expects it before running anything. See the action for the details.
      - uses: ./.github/actions/setup-reme

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Each suite is its own step so a failure names the suite in the UI.
      # tests/conftest.py puts src/ on sys.path; run them from the repo root.
      - name: Unit tests and settings matrix
        run: python tests/test_helper.py

      - name: Baseline snapshot
        run: python tests/test_baseline.py

      - name: i18n table and source coverage
        run: python tests/test_i18n.py

      - name: API key field
        run: python tests/test_key_field.py

      - name: Settings window UI test
        run: python tests/test_settings_ui.py

      - name: Theme consistency
        run: python tests/test_theme_ui.py

      - name: English mode scan
        run: python tests/test_en_mode.py

      - name: Console lifecycle
        run: python tests/test_console_lifecycle.py

      # The update-chain gate was reachable ONLY from scripts/build.bat, i.e. only from the
      # tag-triggered release workflow - so a fix to the gate itself could not be verified
      # without cutting a release. It needs no ASR model and no network, so run it here too.
      # (Same gap, same fix, as local-speak2text's gates 2d-2i.)
      - name: Update chain (real rendered bat)
        run: python tests/test_update_bat.py

      # 1.2.18: template-owned local OTA acceptance - package-root resolution plus the
      # REAL download_and_prepare() + rendered bat replacement chain (no network, no app).
      - name: Local OTA acceptance (template ota_test)
        run: python src/template/ota_test/run_local_ota_test.py --app-id reme-helper

      # 0.4.1.13 job-table adaptation: is_servable(enable_serve:false), the
      # proactive -> proactive_read rename and the new list_tags candidate.
      - name: Expose job table (0.4.1.13 adaptation)
        run: python tests/test_expose_jobs.py

      # Startup hotfix: a blocked/locked log path must not crash module import.
      - name: Log init fail-open
        run: python tests/test_log_failopen.py

      # Startup guard: tray creation can be denied in restricted sessions; retry and
      # surface a readable message instead of a traceback (and never NameError).
      - name: Startup guard (tray fail-open)
        run: python tests/test_startup_guard.py

      # 1.2.11 menu polish: Chinese/Latin spacing and the two bold default items.
      - name: Tray menu labels and default items
        run: python tests/test_tray_menu.py

      # 1.2.14 duplicate launch: second instance writes show.request, never a modal.
      - name: Duplicate launch (show request)
        run: python tests/test_single_instance.py

      - name: Release config template carries no local data
        run: python scripts/make_release_config.py "${{ runner.temp }}\config.json"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            log/tests/*.log
            log/*.log
          if-no-files-found: ignore
