name: release

# Tag a commit and this builds the Windows package, verifies it, and attaches it
# to a GitHub Release. The zip is the download users get: the exe plus the docs
# and the license. The tagging convention matches CHANGELOG.md sections.
#
#   git tag v<version> && git push origin v<version>   (release.bat does this)
#
# The two triggers are deliberately NOT equivalent:
#   * tag push -> build, verify, and PUBLISH a GitHub Release
#   * manual   -> build and upload the artifact only, never publish
# The second half is already enforced by the "Publish GitHub Release" step, which
# is gated on refs/tags/v. run-name makes the difference visible in the Actions
# list, so a manual run cannot be mistaken for a release.

# Manual runs are a dry run, and the run name says so.
run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('release {0}', github.ref_name) || 'build only (no release)' }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # build.bat runs the suites as gates and the frozen exe as checks; both print
    # Chinese. A hosted runner's stdout is a pipe, so without this Python encodes
    # it as the locale default (cp1252) and dies on the first non-ASCII print.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # build.bat runs the suites and the frozen gates, all of which read a real
      # ReMe install (exe, venv Python, official default.yaml). See the action.
      - uses: ./.github/actions/setup-reme

      - name: Read version from src/main.py
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path src/main.py -Pattern '^VERSION = ' | Select-Object -First 1
          if (-not $line) { throw "VERSION not found in src/main.py" }
          $version = ($line.Line -split '"')[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=reme-helper-$version" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version"

      # build.bat runs every test suite as a gate, then PyInstaller, then the
      # packaged checks (--smoke / --ui-check / --make-icon / --release).
      # "release" turns on the --release gate; "norun"/"nopause" keep CI from
      # launching the tray app or waiting for a keypress.
      - name: Build release
        shell: cmd
        run: build.bat release norun nopause

      - name: Package zip
        shell: pwsh
        run: |
          $pkg = "${{ steps.version.outputs.package }}"
          $version = "${{ steps.version.outputs.version }}"
          $dir = "release/$pkg"
          $appId = "reme-helper"
          if (-not (Test-Path "$dir/reme-helper.exe")) { throw "build produced no exe in $dir" }
          # Naming rule (2026-10-26): NO version in any path the app / updater / user
          # resolves. The exe keeps its stable name and the zip's inner folder is the
          # stable APP_ID. The version lives in the exe's PE metadata (build.bat's
          # --version-file) and in the release ASSET name only (download URL).
          $stageRoot = Join-Path ([System.IO.Path]::GetTempPath()) "reme-ota-stage-$pkg"
          $stage = Join-Path $stageRoot $appId
          if (Test-Path $stageRoot) { Remove-Item $stageRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "$dir/*" -Destination $stage -Recurse -Force
          $zip = "release/$pkg-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          Remove-Item $stageRoot -Recurse -Force
          # OTA layout gate: the updater resolves the package root by CONTENT (the unique
          # top-level folder holding the exe). Assert the contract on the REAL artifact:
          # exactly one top-level folder == stable APP_ID (no version suffix), exe present.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $tops = @($archive.Entries | ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique)
            if ($tops.Count -ne 1 -or $tops[0] -ne $appId) {
              throw "OTA layout gate: zip top-level = [$($tops -join ', ')], expected [$appId] (stable, no version)"
            }
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq "$appId/reme-helper.exe" })) {
              throw "OTA layout gate: $appId/reme-helper.exe missing from zip"
            }
          } finally {
            $archive.Dispose()
          }
          # The version must be discoverable WITHOUT reading folder/exe names.
          $fv = (Get-Item "$dir/reme-helper.exe").VersionInfo.FileVersion
          if (-not $fv -or -not $fv.StartsWith($version)) {
            throw "PE version gate: FileVersion='$fv', expected '$version' (embed it via --version-file)"
          }
          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $pkg-windows-x64.zip" } |
            Set-Content "release/$pkg-windows-x64.zip.sha256"
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.package }}-windows-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = "${{ steps.version.outputs.package }}"
          $notes = "Windows package: unpack and run ``reme-helper.exe``. See README.md for setup, CHANGELOG.md for what changed."
          gh release create $tag "release/$pkg-windows-x64.zip" "release/$pkg-windows-x64.zip.sha256" `
            --title "$pkg" --notes $notes
